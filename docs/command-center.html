<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MotionMentor Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* ============================================================
   MotionMentor Command Center
   Instrument-panel identity: IBM Plex family, teal signal accent,
   dark bezel rail against a cool paper content field.
   ============================================================ */

:root{
  --bg:#f1f4f4;
  --surface:#ffffff;
  --surface-2:#e8eded;
  --surface-3:#dde4e4;
  --ink:#0f1a1c;
  --ink-2:#415254;
  --ink-3:#6b7d7f;
  --line:#d2dadb;
  --line-strong:#b6c2c3;
  --accent:#0e7490;
  --accent-ink:#0a5c73;
  --accent-soft:#d8eef3;
  --bezel:#0c1618;
  --bezel-ink:#c6d6d8;
  --bezel-ink-2:#7d9296;
  --bezel-line:#1e2e31;

  --s-gray:#65787a;   --s-gray-bg:#e6ebeb;
  --s-blue:#20558f;   --s-blue-bg:#dde8f4;
  --s-purple:#5f3f9c; --s-purple-bg:#e7e0f6;
  --s-amber:#8f5c00;  --s-amber-bg:#faecd2;
  --s-red:#a52017;    --s-red-bg:#fadedb;
  --s-green:#0f6a43;  --s-green-bg:#d7efe3;

  --r-sm:3px; --r-md:6px; --r-lg:10px;
  --shadow:0 1px 2px rgba(12,22,24,.06),0 8px 24px -12px rgba(12,22,24,.18);
  --rail-w:236px;
}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0a1113;
    --surface:#111a1d;
    --surface-2:#182427;
    --surface-3:#1f2d31;
    --ink:#e5eded;
    --ink-2:#a5b5b7;
    --ink-3:#7a8c8e;
    --line:#243437;
    --line-strong:#33474b;
    --accent:#34b7ce;
    --accent-ink:#6ed2e4;
    --accent-soft:#0e343d;
    --bezel:#060e10;
    --bezel-ink:#cfdedf;
    --bezel-ink-2:#7c9195;
    --bezel-line:#1a292c;

    --s-gray:#93a4a6;   --s-gray-bg:#1d2a2c;
    --s-blue:#7cadea;   --s-blue-bg:#13263a;
    --s-purple:#b294e8; --s-purple-bg:#241c3a;
    --s-amber:#e6a743;  --s-amber-bg:#33260e;
    --s-red:#f4837a;    --s-red-bg:#3a1a17;
    --s-green:#4ac48c;  --s-green-bg:#0f2f22;

    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0a1113;
  --surface:#111a1d;
  --surface-2:#182427;
  --surface-3:#1f2d31;
  --ink:#e5eded;
  --ink-2:#a5b5b7;
  --ink-3:#7a8c8e;
  --line:#243437;
  --line-strong:#33474b;
  --accent:#34b7ce;
  --accent-ink:#6ed2e4;
  --accent-soft:#0e343d;
  --bezel:#060e10;
  --bezel-ink:#cfdedf;
  --bezel-ink-2:#7c9195;
  --bezel-line:#1a292c;

  --s-gray:#93a4a6;   --s-gray-bg:#1d2a2c;
  --s-blue:#7cadea;   --s-blue-bg:#13263a;
  --s-purple:#b294e8; --s-purple-bg:#241c3a;
  --s-amber:#e6a743;  --s-amber-bg:#33260e;
  --s-red:#f4837a;    --s-red-bg:#3a1a17;
  --s-green:#4ac48c;  --s-green-bg:#0f2f22;

  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;margin:0;text-wrap:balance;letter-spacing:-.005em}
h1{font-size:1.85rem;font-weight:700;line-height:1.15}
h2{font-size:1.28rem;font-weight:600}
h3{font-size:1.02rem;font-weight:600}
p{margin:0}
a{color:var(--accent-ink)}
code,.mono,.num{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh;align-items:stretch}
.rail{
  width:var(--rail-w);flex:0 0 var(--rail-w);background:var(--bezel);color:var(--bezel-ink);
  display:flex;flex-direction:column;gap:2px;padding-block:20px;padding-inline:0;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.rail-brand{padding:0 20px 16px;border-bottom:1px solid var(--bezel-line);margin-bottom:12px}
.rail-brand .mark{
  font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--bezel-ink-2);display:block;margin-bottom:6px;
}
.rail-brand .name{font-family:"IBM Plex Sans Condensed",sans-serif;font-size:1.22rem;font-weight:700;color:#fff;letter-spacing:-.01em;line-height:1.1}
.rail-brand .sub{font-size:.74rem;color:var(--bezel-ink-2);margin-top:4px}
.nav{display:flex;flex-direction:column;gap:1px;padding-inline:10px}
.nav-group{font-family:"IBM Plex Mono",monospace;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:#5d7276;padding:14px 10px 5px}
.nav a{
  display:flex;align-items:baseline;gap:9px;padding:7px 10px;border-radius:var(--r-md);
  color:var(--bezel-ink);text-decoration:none;font-size:.86rem;border-left:2px solid transparent;
}
.nav a .idx{font-family:"IBM Plex Mono",monospace;font-size:.66rem;color:#5d7276;width:1.1em;flex:0 0 auto}
.nav a:hover{background:#132226}
.nav a[aria-current="page"]{background:#152a2f;color:#fff;border-left-color:var(--accent)}
.nav a[aria-current="page"] .idx{color:var(--accent)}
.rail-foot{margin-top:auto;padding:16px 20px 0;border-top:1px solid var(--bezel-line);font-size:.72rem;color:var(--bezel-ink-2);display:flex;flex-direction:column;gap:8px}
.rail-foot button{background:#16272b;border:1px solid var(--bezel-line);color:var(--bezel-ink);padding:6px 10px;border-radius:var(--r-md);cursor:pointer;font-size:.74rem;text-align:left}
.rail-foot button:hover{background:#1d3237}

.main{flex:1;min-width:0;padding-block:26px 64px;padding-inline:clamp(16px,3vw,40px)}
.view{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.view-head{display:flex;flex-direction:column;gap:6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:.63rem;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3)}
.view-head p{color:var(--ink-2);max-width:66ch}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px}
.grid{display:grid;gap:14px}
.section{display:flex;flex-direction:column;gap:12px}
.section > .sec-title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-title .count{font-family:"IBM Plex Mono",monospace;font-size:.72rem;color:var(--ink-3)}
.muted{color:var(--ink-3)}
.dim{color:var(--ink-2)}
.small{font-size:.82rem}
.tiny{font-size:.74rem}
hr.rule{border:0;border-top:1px solid var(--line);margin:0}

.badge{
  display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:100px;
  font-size:.72rem;font-weight:500;line-height:1.5;white-space:nowrap;
  background:var(--s-gray-bg);color:var(--s-gray);border:1px solid transparent;
}
.badge .g{font-size:.66rem;line-height:1}
.badge.gray{background:var(--s-gray-bg);color:var(--s-gray)}
.badge.blue{background:var(--s-blue-bg);color:var(--s-blue)}
.badge.purple{background:var(--s-purple-bg);color:var(--s-purple)}
.badge.amber{background:var(--s-amber-bg);color:var(--s-amber)}
.badge.red{background:var(--s-red-bg);color:var(--s-red)}
.badge.green{background:var(--s-green-bg);color:var(--s-green)}
.badge.assumed{background:transparent;color:var(--ink-3);border:1px dashed var(--line-strong);font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.06em}

.bar{height:6px;border-radius:100px;background:var(--surface-2);overflow:hidden;position:relative}
.bar > i{display:block;height:100%;border-radius:100px;background:var(--accent)}
.bar.green > i{background:var(--s-green)} .bar.amber > i{background:var(--s-amber)}
.bar.red > i{background:var(--s-red)} .bar.purple > i{background:var(--s-purple)}
.bar.gray > i{background:var(--s-gray)} .bar.blue > i{background:var(--s-blue)}

table{border-collapse:collapse;width:100%;font-size:.84rem}
th{text-align:left;font-family:"IBM Plex Mono",monospace;font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line-strong);white-space:nowrap;vertical-align:bottom}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.scroll-x{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
.scroll-x table{min-width:760px}
tbody tr.flagged td:first-child{box-shadow:inset 3px 0 0 var(--s-red)}
tbody tr.warned td:first-child{box-shadow:inset 3px 0 0 var(--s-amber)}

.kv{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:5px 16px;font-size:.85rem}
.kv dt{font-family:"IBM Plex Mono",monospace;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding-top:2px}
.kv dd{margin:0}
ul.tight{margin:0;padding-left:1.05rem;display:flex;flex-direction:column;gap:4px}
ul.tight li::marker{color:var(--ink-3)}
ul.none{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}

.chipline{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:"IBM Plex Mono",monospace;font-size:.7rem;padding:2px 7px;border-radius:var(--r-sm);background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.evi{font-family:"IBM Plex Mono",monospace;font-size:.7rem;color:var(--ink-3)}

/* ---------- overview ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
.mission{font-size:1.02rem;color:var(--ink-2);max-width:60ch}
.healthbox{border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.healthbox .hl{display:flex;align-items:center;gap:10px}
.healthbox .hl .dotstrip{width:5px;align-self:stretch;border-radius:100px;background:var(--s-amber)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--surface)}
.metric{padding:14px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.metric:last-child{border-right:0}
.metric .lab{font-family:"IBM Plex Mono",monospace;font-size:.63rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.metric .val{font-family:"IBM Plex Sans Condensed",sans-serif;font-size:1.72rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.metric .note{font-size:.75rem;color:var(--ink-3)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.risklist li,.acclist li{display:flex;gap:10px;align-items:flex-start}
.risklist .sev{flex:0 0 auto;margin-top:2px}
details.calc{border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-2);padding:10px 12px}
details.calc summary{cursor:pointer;font-size:.8rem;color:var(--accent-ink);font-weight:500}
details.calc[open] summary{margin-bottom:8px}

/* ---------- phases ---------- */
details.phase{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden}
details.phase + details.phase{margin-top:10px}
details.phase > summary{
  cursor:pointer;list-style:none;padding:14px 18px;display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;
}
details.phase > summary::-webkit-details-marker{display:none}
details.phase[open] > summary{border-bottom:1px solid var(--line);background:var(--surface-2)}
.pnum{font-family:"IBM Plex Mono",monospace;font-size:.78rem;color:var(--ink-3);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:2px 6px}
.psum-main{display:flex;flex-direction:column;gap:4px;min-width:0}
.psum-main .t{font-family:"IBM Plex Sans Condensed",sans-serif;font-weight:600;font-size:1.04rem}
.psum-right{display:flex;align-items:center;gap:12px}
.psum-right .pct{font-family:"IBM Plex Mono",monospace;font-size:.85rem;font-variant-numeric:tabular-nums;width:3.4em;text-align:right}
.psum-right .bar{width:110px}
.pbody{padding:16px 18px;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.pbody .full{grid-column:1/-1}
.crit li{font-size:.83rem}

/* ---------- timeline ---------- */
.tl{position:relative;padding-left:30px;display:flex;flex-direction:column;gap:14px}
.tl::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tlitem{position:relative}
.tlitem::before{
  content:"";position:absolute;left:-26px;top:16px;width:12px;height:12px;border-radius:50%;
  background:var(--surface);border:2px solid var(--s-gray);
}
.tlitem.done::before{background:var(--s-green);border-color:var(--s-green)}
.tlitem.risk::before{background:var(--s-amber);border-color:var(--s-amber)}
.tlitem.blocked::before{background:var(--s-red);border-color:var(--s-red)}
.tlitem.future::before{border-color:var(--line-strong)}
.tlhead{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;margin-bottom:6px}
.tlhead .mid{font-family:"IBM Plex Mono",monospace;font-size:.76rem;color:var(--accent-ink);font-weight:500}
.tldates{display:flex;flex-wrap:wrap;gap:14px;font-size:.78rem;color:var(--ink-2);margin-top:8px}
.tldates b{font-family:"IBM Plex Mono",monospace;font-weight:500;color:var(--ink)}

/* ---------- kanban ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px 12px}
.toolbar label{display:flex;flex-direction:column;gap:3px;font-family:"IBM Plex Mono",monospace;font-size:.61rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.toolbar select,.toolbar input[type="search"]{
  font-family:"IBM Plex Sans",sans-serif;font-size:.82rem;padding:5px 8px;border:1px solid var(--line-strong);
  border-radius:var(--r-md);background:var(--bg);color:var(--ink);min-width:132px;
}
.toolbar .spacer{flex:1}
.btn{background:var(--surface-2);border:1px solid var(--line-strong);border-radius:var(--r-md);padding:6px 11px;font-size:.8rem;cursor:pointer}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(232px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px;align-items:start}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.colhead{display:flex;align-items:center;gap:8px;justify-content:space-between}
.colhead .nm{font-family:"IBM Plex Mono",monospace;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.colhead .ct{font-family:"IBM Plex Mono",monospace;font-size:.7rem;color:var(--ink-3)}
.colrule{height:2px;border-radius:2px;background:var(--s-gray);opacity:.7}
.wi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:10px;display:flex;flex-direction:column;gap:7px;cursor:pointer;text-align:left;width:100%}
.wi:hover{border-color:var(--line-strong)}
.wi .id{font-family:"IBM Plex Mono",monospace;font-size:.66rem;color:var(--ink-3)}
.wi .ti{font-size:.84rem;font-weight:500;line-height:1.35}
.wi .meta{display:flex;flex-wrap:wrap;gap:5px}
.wi[data-pri="Critical"]{box-shadow:inset 3px 0 0 var(--s-red)}
.wi[data-pri="High"]{box-shadow:inset 3px 0 0 var(--s-amber)}
.empty{font-size:.76rem;color:var(--ink-3);padding:6px 2px;font-style:italic}

/* ---------- detail drawer ---------- */
.drawer{position:fixed;inset:0;background:rgba(8,16,18,.5);display:none;z-index:40;padding:20px}
.drawer[open],.drawer.on{display:flex;justify-content:flex-end}
.drawer-panel{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-lg);width:min(520px,100%);max-height:100%;overflow-y:auto;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.drawer-close{align-self:flex-end}

/* ---------- architecture ---------- */
.archwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:8px}
.archwrap svg{display:block;min-width:900px;max-width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.78rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:22px;height:12px;border-radius:2px;display:inline-block}

/* ---------- risk matrix ---------- */
.matrix{display:grid;grid-template-columns:auto repeat(3,minmax(96px,1fr));gap:4px;font-size:.76rem}
.matrix .mh{font-family:"IBM Plex Mono",monospace;font-size:.63rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;justify-content:center;padding:4px}
.matrix .rh{justify-content:flex-end;text-align:right;padding-right:8px}
.cell{border-radius:var(--r-md);padding:8px;min-height:64px;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;border:1px solid var(--line)}
.cell.lo{background:var(--s-green-bg)} .cell.md{background:var(--s-amber-bg)} .cell.hi{background:var(--s-red-bg)}
.cell .rid{font-family:"IBM Plex Mono",monospace;font-size:.68rem;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:1px 5px;cursor:default}

/* ---------- stakeholder ---------- */
.stake{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:clamp(18px,3vw,32px);display:flex;flex-direction:column;gap:24px}
.stake h2{font-size:1.1rem}
.stake .lede{font-size:1.05rem;color:var(--ink-2);max-width:62ch}
.phasebars{display:flex;flex-direction:column;gap:10px}
.phasebar{display:grid;grid-template-columns:minmax(150px,1fr) minmax(90px,220px) 3.4em;gap:12px;align-items:center;font-size:.86rem}
.phasebar .pct{font-family:"IBM Plex Mono",monospace;text-align:right;font-variant-numeric:tabular-nums;font-size:.8rem}

/* ---------- exports ---------- */
.exportgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
textarea.io{
  width:100%;min-height:220px;font-family:"IBM Plex Mono",monospace;font-size:.74rem;line-height:1.5;
  padding:11px;border:1px solid var(--line-strong);border-radius:var(--r-md);background:var(--bg);color:var(--ink);resize:vertical;
}
.note-band{border-left:3px solid var(--accent);background:var(--accent-soft);padding:11px 14px;border-radius:0 var(--r-md) var(--r-md) 0;font-size:.85rem;color:var(--ink-2)}
.note-band.warn{border-left-color:var(--s-amber);background:var(--s-amber-bg)}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .shell{flex-direction:column}
  .rail{width:100%;flex:none;position:static;height:auto;padding-block:14px;gap:8px}
  .rail-brand{padding-inline:16px}
  .nav{flex-direction:row;overflow-x:auto;padding-inline:12px;gap:4px}
  .nav-group{display:none}
  .nav a{white-space:nowrap;border-left:0;border-bottom:2px solid transparent;padding:6px 10px}
  .nav a[aria-current="page"]{border-left:0;border-bottom-color:var(--accent)}
  .rail-foot{margin-top:8px;flex-direction:row;flex-wrap:wrap;align-items:center}
  .hero{grid-template-columns:1fr}
  .metric{border-right:0;border-bottom:1px solid var(--line)}
}
@media (max-width:520px){
  .phasebar{grid-template-columns:1fr 3.4em;gap:6px}
  .phasebar .bar{grid-column:1/-1}
  .metrics{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{

/* state ∈ impl | planned | external | unused                                 */
architecture: {
  note:"Every node names the real file that implements it. Layers read top to bottom as the request path: a client calls the API, which drives capture, perception, processing, comparison, and persistence.",
  layers: [
    { name:"Clients", nodes:[
      { t:"CLI — motion-mentor", f:"cli.py · 10 subcommands", s:"impl" },
      { t:"Web dashboard", f:"web/index.html · app.js", s:"impl" },
      { t:"XR / mobile client", f:"PRD §4.2 non-goal · Phase 7", s:"planned" }
    ]},
    { name:"API", nodes:[
      { t:"FastAPI application", f:"server.py:22 · uvicorn 127.0.0.1:8000", s:"impl" },
      { t:"REST surface", f:"server.py · 13 endpoints under /api", s:"impl" }
    ]},
    { name:"Capture", nodes:[
      { t:"CameraCapture", f:"capture/camera.py:29", s:"impl" },
      { t:"SyntheticCamera", f:"capture/camera.py:101", s:"impl" },
      { t:"SessionRecorder", f:"capture/recorder.py:24", s:"impl" },
      { t:"HUDOverlay", f:"capture/hud.py:13", s:"impl" }
    ]},
    { name:"Perception", nodes:[
      { t:"HandTracker — 21 landmarks/hand", f:"tracking/hand_tracker.py:49", s:"impl" },
      { t:"hand_landmarker.task", f:"models/ · referenced in config, never loaded", s:"unused" }
    ]},
    { name:"Processing", nodes:[
      { t:"Smoothing — One Euro", f:"processing/smoothing.py:30", s:"impl" },
      { t:"Normalization", f:"processing/normalization.py:11", s:"impl" },
      { t:"Feature extraction", f:"processing/features.py:82", s:"impl" }
    ]},
    { name:"Comparison", nodes:[
      { t:"Constrained DTW", f:"comparison/dtw.py:21", s:"impl" },
      { t:"Reference builder", f:"comparison/reference.py:51", s:"impl" },
      { t:"Scoring engine", f:"comparison/scoring.py:47", s:"impl" },
      { t:"Feedback generator", f:"comparison/feedback.py:32", s:"impl" },
      { t:"Pipeline orchestrator", f:"comparison/pipeline.py:50", s:"impl" }
    ]},
    { name:"Storage", nodes:[
      { t:"SQLite — 4 tables", f:"storage/database.py:21", s:"impl" },
      { t:"Parquet + JSON export", f:"storage/files.py:20", s:"impl" },
      { t:"Pydantic schemas", f:"storage/models.py", s:"impl" }
    ]},
    { name:"External", nodes:[
      { t:"MediaPipe 0.10.20–21", f:"legacy mp.solutions.hands", s:"external" },
      { t:"OpenCV ≥ 4.8", f:"capture + replay + drawing", s:"external" },
      { t:"ffmpeg", f:"optional · shutil.which guarded", s:"external" },
      { t:"PyTorch / YOLO", f:"Phase 6–7 · not a dependency", s:"planned" }
    ]}
  ]
},

/* ---------------------------------------------------------------- helpers */
/* RENDER CONTRACT
   Views are built as HTML strings and inserted through paint() below, which is
   the only DOM sink in this file. Every value that comes from PROJECT passes
   through esc() at its interpolation site, so markup can only originate from
   this file's own literals. Imported JSON is additionally validated by
   sanitizeImport() before it is ever allowed to reach a view. */
const $ = s => document.querySelector(s);
const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const j = (a, sep = "") => (a || []).join(sep);
const pct = n => Math.round(n) + "%";

function paint(el, html) {
  el.textContent = "";
  const tpl = document.createElement("template");
  tpl.textContent = "";            // template content is inert until adopted
  tpl.insertAdjacentHTML("afterbegin", html);
  el.append(...tpl.childNodes);
}

/* Reject anything that is not plain JSON data. Blocks functions, prototype
   pollution via __proto__/constructor keys, and absurd nesting depth. */
function sanitizeImport(value, depth = 0) {
  if (depth > 12) throw new Error("Imported data is nested too deeply.");
  if (value === null) return null;
  const t = typeof value;
  if (t === "string" || t === "number" || t === "boolean") return value;
  if (Array.isArray(value)) return value.map(v => sanitizeImport(v, depth + 1));
  if (t === "object") {
    const out = {};
    for (const k of Object.keys(value)) {
      if (k === "__proto__" || k === "constructor" || k === "prototype") continue;
      out[k] = sanitizeImport(value[k], depth + 1);
    }
    return out;
  }
  throw new Error("Imported data contains a value that is not plain JSON: " + t);
}

function badge(label, hueOverride) {
  const s = STATUS[label] || { hue: hueOverride || "gray", g:"·" };
  const hue = hueOverride || s.hue;
  return `<span class="badge ${hue}"><span class="g" aria-hidden="true">${s.g}</span>${esc(label)}</span>`;
}
const assumedTag = on => on ? `<span class="badge assumed">ASSUMED</span>` : "";

/* ------------------------------------------------------------- progress -- */
/* Weights are the ones the brief specifies. No effort weighting is applied:
   the PRD estimates effort per milestone, never per task, so an unweighted
   mean is the honest calculation. The overview shows this working. */
const WEIGHT = { "Backlog":0, "Ready":5, "In Progress":50, "Testing":85, "Complete":100 };
function itemProgress(w) {
  if (w.st === "Blocked") return typeof w.last === "number" ? w.last : 0; // keep last confirmed
  return WEIGHT[w.st] ?? 0;
}
const phaseItems = pid => PROJECT.workItems.filter(w => w.p === pid);
function phaseProgress(pid) {
  const items = phaseItems(pid);
  if (!items.length) return 0;
  return items.reduce((a, w) => a + itemProgress(w), 0) / items.length;
}
const overallProgress = () =>
  PROJECT.workItems.reduce((a, w) => a + itemProgress(w), 0) / PROJECT.workItems.length;
function statusCounts() {
  const c = { Backlog:0, Ready:0, "In Progress":0, Blocked:0, Testing:0, Complete:0 };
  PROJECT.workItems.forEach(w => c[w.st] = (c[w.st] || 0) + 1);
  return c;
}

  const q = filters.q.trim().toLowerCase();

  if (filters.pri    && w.pri !== filters.pri)    return false;

}

/* =============================================== VIEW 5 — ARCHITECTURE === */
const ARCH_STATE = {
  impl:     { fill:"var(--surface)",  stroke:"var(--accent)",       dash:"",     label:"Implemented" },
  planned:  { fill:"var(--surface-2)",stroke:"var(--line-strong)",  dash:"5 4",  label:"Planned" },
  external: { fill:"var(--surface-2)",stroke:"var(--s-gray)",       dash:"2 3",  label:"External dependency" },
  unused:   { fill:"var(--s-amber-bg)",stroke:"var(--s-amber)",     dash:"5 4",  label:"Present but unused" }
};

function archSvg() {
  const L = PROJECT.architecture.layers;
  const W = 1060, bandH = 76, gapY = 20, x0 = 168, x1 = 1040, avail = x1 - x0;
  const H = L.length * (bandH + gapY) + gapY;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="MotionMentor layered architecture, ${L.length} layers">`;

  L.forEach((layer, li) => {
    const y = gapY + li * (bandH + gapY);
    s += `<rect x="8" y="${y}" width="${W - 16}" height="${bandH}" rx="8" fill="var(--surface-2)" stroke="var(--line)"/>`;
    s += `<text x="150" y="${y + bandH / 2 + 4}" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="11" letter-spacing="1.2" fill="var(--ink-3)">${esc(layer.name.toUpperCase())}</text>`;

    const n = layer.nodes.length, gap = 18;
    const w = (avail - gap * (n - 1)) / n;
    layer.nodes.forEach((node, ni) => {
      const st = ARCH_STATE[node.s] || ARCH_STATE.impl;
      const x = x0 + ni * (w + gap), ny = y + 13, nh = bandH - 26;
      s += `<rect x="${x}" y="${ny}" width="${w}" height="${nh}" rx="6" fill="${st.fill}" stroke="${st.stroke}" stroke-width="1.5"${st.dash ? ` stroke-dasharray="${st.dash}"` : ""}/>`;
      s += `<text x="${x + 11}" y="${ny + 20}" font-family="IBM Plex Sans, sans-serif" font-size="12.5" font-weight="600" fill="var(--ink)">${esc(node.t)}</text>`;
      s += `<text x="${x + 11}" y="${ny + 37}" font-family="IBM Plex Mono, monospace" font-size="10" fill="var(--ink-3)">${esc(node.f)}</text>`;
    });

    if (li < L.length - 1) {
      const ay = y + bandH + 3, cx = W / 2;
      s += `<path d="M ${cx - 7} ${ay} L ${cx} ${ay + 9} L ${cx + 7} ${ay}" fill="none" stroke="var(--line-strong)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
    }
  });
  return s + `</svg>`;
}

function viewArchitecture() {
  return `
  <div class="view-head">
    <span class="eyebrow">System architecture</span>
    <h1>Capture to score, in eight layers</h1>
    <p>${esc(PROJECT.architecture.note)}</p>
  </div>
  <div class="legend">
    ${j(Object.values(ARCH_STATE).map(s =>
      `<span><i style="background:${s.fill};border:1.5px ${s.dash ? "dashed" : "solid"} ${s.stroke}"></i>${esc(s.label)}</span>`))}
  </div>
  <div class="archwrap">${archSvg()}</div>
  <div class="note-band warn">Two things this diagram is telling you. The MediaPipe model asset sits in the tree, is named in the config, and is never loaded — the tracker uses the legacy solutions API instead (ISS-08). And nothing above the API layer is planned except future clients: every box in the processing and comparison layers already exists and is unit-tested. The project's risk is not missing code, it is unvalidated behaviour in the code that exists.</div>`;

const LEVELS = ["Low", "Medium", "High"];
function riskMatrix() {
  const cellClass = (pi, ii) => {
    const score = (pi + 1) * (ii + 1);
    return score >= 6 ? "hi" : score >= 3 ? "md" : "lo";
  };
  let html = `<div class="matrix">
    <span class="mh"></span>${j(LEVELS.map(l => `<span class="mh">Impact: ${esc(l)}</span>`))}`;
  [...LEVELS].reverse().forEach(prob => {
    const pi = LEVELS.indexOf(prob);
    html += `<span class="mh rh">Probability<br>${esc(prob)}</span>`;
    LEVELS.forEach((imp, ii) => {
      const inCell = PROJECT.risks.filter(r => r.prob === prob && r.imp === imp);
      html += `<div class="cell ${cellClass(pi, ii)}">${j(inCell.map(r =>
        `<span class="rid" title="${esc(r.d)}">${esc(r.id)}</span>`))}</div>`;
    });
  });
  return html + `</div>`;
}

/* ================================================================ reports */
function reportMarkdown() {
  const m = PROJECT.meta, op = overallProgress();
  const L = [];
  L.push(`# ${m.name} — Status Report`, "", `**Updated:** ${m.lastUpdated}  `, `**Phase:** ${m.currentPhase}  `,
    `**Health:** ${m.health}  `, `**Overall progress:** ${pct(op)}`, "", `> ${m.mission}`, "",
    `## Where it stands`, "", m.healthWhy, "", `## Progress by phase`, "",
    `| Phase | Status | Progress |`, `| --- | --- | --- |`);
  PROJECT.phases.forEach(p => L.push(`| ${p.num} ${p.name} | ${p.status} | ${pct(phaseProgress(p.id))} |`));
  L.push("", `## Open issues`, "");
  PROJECT.issues.filter(i => i.st === "Open").forEach(i => L.push(`- **${i.id}** (${i.sev}) ${i.d}`, `  - Evidence: ${i.evi}`));
  L.push("", `## Next actions`, "");
  m.nextActions.forEach((a, i) => L.push(`${i + 1}. ${a}`));
  L.push("", `## Next milestone`, "");
  const ms = PROJECT.milestones.find(x => !x.actual);
  if (ms) L.push(`**${ms.id} — ${ms.name}** · target ${ms.target || "Not scheduled"}${ms.targetAssumed ? " (ASSUMED)" : ""} · confidence ${ms.confidence}`, "", ms.note);
  return L.join("\n");
}
function reportBlocked() {
  const b = PROJECT.workItems.filter(w => w.st === "Blocked");
  const L = [`# Blocked work — ${PROJECT.meta.lastUpdated}`, "", `${b.length} blocked item(s).`, ""];
  b.forEach(w => L.push(`## ${w.id} — ${w.t}`, "", `- Waiting on: ${j(w.deps, ", ") || "unspecified"}`,
    `- Progress held at: ${pct(itemProgress(w))}`, `- Phase: ${phaseNum(w.p)}`, `- Note: ${w.n}`, ""));
  const issues = PROJECT.issues.filter(i => i.st === "Open" && i.sev === "Critical");
  L.push(`## Critical open issues behind these blocks`, "");
  issues.forEach(i => L.push(`- **${i.id}** ${i.d}`, `  - ${i.why}`));
  return L.join("\n");
}
function reportNext() {
  const ready = PROJECT.workItems.filter(w => w.st === "Ready" || w.st === "In Progress")
    .sort((a, b) => ["Critical","High","Medium","Low"].indexOf(a.pri) - ["Critical","High","Medium","Low"].indexOf(b.pri));
  const L = [`# Next actions — ${PROJECT.meta.lastUpdated}`, "", `## Stated priorities`, ""];
  PROJECT.meta.nextActions.forEach((a, i) => L.push(`${i + 1}. ${a}`));
  L.push("", `## Actionable work items (${ready.length})`, "");
  ready.forEach(w => L.push(`- **${w.id}** [${w.pri}] ${w.t}`, `  - ${w.d}`,
    `  - Acceptance: ${j(w.ac, " · ")}`, w.deps.length ? `  - Depends on: ${j(w.deps, ", ")}` : ""));
  return L.filter(Boolean).join("\n");
}
function reportWeekly() {
  const L = [`# Weekly progress — week ending ${PROJECT.meta.lastUpdated}`, "", `**Overall:** ${pct(overallProgress())} · **Health:** ${PROJECT.meta.health}`, "",
    `## Completed this period`, ""];
  PROJECT.activity.slice(0, 8).forEach(a => L.push(`- ${a.ts} — ${a.sum}${a.done ? ` (${a.done})` : ""}`));
  L.push("", `## Now in flight`, "");
  PROJECT.workItems.filter(w => w.st === "In Progress" || w.st === "Ready").forEach(w => L.push(`- ${w.id} ${w.t} [${w.pri}]`));
  L.push("", `## Blocked`, "");
  PROJECT.workItems.filter(w => w.st === "Blocked").forEach(w => L.push(`- ${w.id} ${w.t} — waiting on ${j(w.deps, ", ")}`));
  L.push("", `## Risks needing attention`, "");
  PROJECT.issues.filter(i => i.sev === "Critical" || i.sev === "High").forEach(i => L.push(`- ${i.id} (${i.sev}) ${i.d}`));
  return L.join("\n");
}
function reportStakeholder() {
  const m = PROJECT.meta;
  const L = [`# ${m.name}`, "", m.mission, "", `**Status:** ${m.health} · ${m.currentPhase} · ${pct(overallProgress())} complete`, "",
    m.healthWhy, "", `## Progress by phase`, ""];
  PROJECT.phases.forEach(p => L.push(`- ${p.num} ${p.name}: ${p.status} — ${pct(phaseProgress(p.id))}`));
  L.push("", `## Recently finished`, "");
  m.recentWins.forEach(w => L.push(`- ${w.text}`));
  L.push("", `## Decisions and help needed`, "",
    "- Confirm the proposed MVP hardening phase (DEC-09).",
    "- Identify at least two qualified reviewers to independently score a sample of attempts.",
    "- Schedule expert recording time for five or more demonstrations of the benchmark task.");
  return L.join("\n");
}

/* ================================================================= router */
const RENDERERS = {
  overview: viewOverview, roadmap: viewRoadmap, timeline: viewTimeline, work: viewWork,
  architecture: viewArchitecture, hardware: viewHardware, requirements: viewRequirements,
  testing: viewTesting, risks: viewRisks, decisions: viewDecisions, activity: viewActivity,
  stakeholder: viewStakeholder, data: viewData, protocol: viewProtocol
};
let currentView = "overview";

function render(keepScroll) {
  const y = window.scrollY;
  const fn = RENDERERS[currentView] || viewOverview;
  paint($("#viewRoot"), `<div class="view">${fn()}</div>`);
  renderNav(currentView);
  document.title = `MotionMentor Command Center`;
  wireView();
  if (keepScroll) window.scrollTo(0, y); else window.scrollTo(0, 0);
}

function route() {
  const id = (location.hash || "#overview").slice(1);
  currentView = RENDERERS[id] ? id : "overview";
  render(false);
}

/* ================================================== per-view wiring ====== */
function wireView() {
  if (currentView === "work") {
    const bind = (sel, key) => {
      const el = $(sel); if (!el) return;
      el.addEventListener("change", () => { filters[key] = el.value; render(true); });
    };
    bind("#fPhase", "phase"); bind("#fStream", "stream"); bind("#fPri", "pri");
    bind("#fSt", "st"); bind("#fOwner", "owner");
    const q = $("#fQ");
    if (q) q.addEventListener("input", () => {
      filters.q = q.value;
      render(true);
      const again = $("#fQ");
      if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
    });
    const clear = $("#fClear");
    if (clear) clear.addEventListener("click", () => {
      Object.keys(filters).forEach(k => filters[k] = "");
      render(true);
    });
    document.querySelectorAll(".wi").forEach(b =>
      b.addEventListener("click", () => openItem(b.dataset.item)));
  }

  if (currentView === "data") {
    const box = $("#ioBox"), status = $("#ioStatus");
    const put = (text, msg) => {
      box.value = text;
      status.textContent = msg;
      if (navigator.clipboard) navigator.clipboard.writeText(text)
        .then(() => status.textContent = msg + " — copied to clipboard")
        .catch(() => { /* clipboard blocked; the text is in the box either way */ });
    };
    const REPORTS = {
      json:    () => put(JSON.stringify(PROJECT, null, 2), "Full project data as JSON"),
      md:      () => put(reportMarkdown(), "Markdown status report"),
      weekly:  () => put(reportWeekly(), "Weekly progress summary"),
      blocked: () => put(reportBlocked(), "Blocked tasks report"),
      next:    () => put(reportNext(), "Next actions report"),
      stake:   () => put(reportStakeholder(), "Stakeholder summary")
    };
    document.querySelectorAll("[data-x]").forEach(b =>
      b.addEventListener("click", () => REPORTS[b.dataset.x]()));

    $("#btnCopy").addEventListener("click", () => {
      if (navigator.clipboard) navigator.clipboard.writeText(box.value)
        .then(() => status.textContent = "Copied to clipboard")
        .catch(() => status.textContent = "Clipboard unavailable — select the text and copy manually");
    });

    $("#btnImport").addEventListener("click", () => {
      let parsed;
      try { parsed = JSON.parse(box.value); }
      catch (e) { status.textContent = "That is not valid JSON: " + e.message; return; }
      let clean;
      try { clean = sanitizeImport(parsed); }
      catch (e) { status.textContent = e.message; return; }
      if (!clean || !Array.isArray(clean.workItems) || !Array.isArray(clean.phases)) {
        status.textContent = "Import needs an object with workItems and phases arrays. Nothing was changed.";
        return;
      }
      Object.keys(PROJECT).forEach(k => delete PROJECT[k]);
      Object.assign(PROJECT, clean);
      status.textContent = `Imported — ${PROJECT.workItems.length} work items, overall now ${pct(overallProgress())}. This session only.`;
      render(true);
    });
  }
}

/* ================================================== drawer, theme, boot == */
function closeDrawer() { $("#drawer").classList.remove("on"); }
$("#drawer").addEventListener("click", e => { if (e.target.id === "drawer") closeDrawer(); });
$("#drawerPanel").addEventListener("click", e => { if (e.target.id === "drawerClose") closeDrawer(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

const THEME_KEY = "mm-cc-theme";
function systemDark() { return window.matchMedia("(prefers-color-scheme: dark)").matches; }
function currentTheme() { return document.documentElement.dataset.theme || (systemDark() ? "dark" : "light"); }
function applyTheme(t) {
  if (t) document.documentElement.dataset.theme = t;
  $("#themeBtn").textContent = currentTheme() === "dark" ? "Switch to light" : "Switch to dark";
}
try { const saved = localStorage.getItem(THEME_KEY); if (saved) applyTheme(saved); else applyTheme(null); }
catch (e) { applyTheme(null); }
$("#themeBtn").addEventListener("click", () => {
  const next = currentTheme() === "dark" ? "light" : "dark";
  applyTheme(next);
  try { localStorage.setItem(THEME_KEY, next); } catch (e) { /* private mode: theme is session-only */ }
});

$("#footStamp").textContent = `Updated ${PROJECT.meta.lastUpdated} · ${PROJECT.workItems.length} items`;
window.addEventListener("hashchange", route);
route();
</script>
