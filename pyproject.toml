[project]
name = "motion-mentor"
version = "0.1.0"
description = "Explainable hand motion skill assessment and procedural coaching system"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.20,<=0.10.21",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
motion-mentor = "motion_mentor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/motion_mentor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
