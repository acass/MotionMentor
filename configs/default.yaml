# MotionMentor Default Configuration
camera:
  device_id: 0
  width: 1280
  height: 720
  target_fps: 30
  buffer_size: 1
  exposure: null # auto

tracking:
  model_path: "models/hand_landmarker.task"
  model_url: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task"
  num_hands: 2
  min_detection_confidence: 0.5
  min_presence_confidence: 0.5
  min_tracking_confidence: 0.5
  infer_max_width: 640 # downscale before inference; 0 = full resolution

storage:
  database_path: "data/motion_mentor.db"
  recordings_dir: "data/recordings"
  landmarks_dir: "data/landmarks"
  references_dir: "data/references"

hud:
  show_skeleton: true
  show_telemetry: true
  show_capture_zone: true
  capture_zone_padding: 0.1 # 10% margin on border
  font_scale: 0.6
  line_thickness: 2
